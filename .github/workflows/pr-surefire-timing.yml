name: Surefire Timing Report

# Collect per-method test timings from surefire XML reports and upload them as
# a build artifact so slow individual test methods can be identified.
# Triggered on every PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'LICENSE'
      - '**/.gitignore'
      - '**.md'
      - '**.adoc'
      - '*.txt'
      - 'docsimg/**'
      - '.ci/jenkins/**'

jobs:
  surefire-timing:
    concurrency:
      group: pr-surefire-timing_${{ matrix.os }}_${{ matrix.java-version }}_${{ matrix.maven-version }}_${{ github.head_ref }}
      cancel-in-progress: true
    timeout-minutes: 240
    strategy:
      matrix:
        os: [ubuntu-latest]
        java-version: [17]
        maven-version: ['3.9.11']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Java-${{ matrix.java-version }} / Maven-${{ matrix.maven-version }}
    env:
      DEPENDENCY_TREE_FILE: 'mvn_dependency_tree_surefire_timing_${{ matrix.os }}.txt'

    steps:
      - name: Clean Disk Space
        uses: apache/incubator-kie-kogito-pipelines/.ci/actions/ubuntu-disk-space@main
        if: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Java and Maven Setup
        uses: apache/incubator-kie-kogito-pipelines/.ci/actions/maven@main
        with:
          java-version: ${{ matrix.java-version }}
          maven-version: ${{ matrix.maven-version }}
          cache-key-prefix: ${{ runner.os }}-${{ matrix.java-version }}-maven${{ matrix.maven-version }}

      - name: Build Chain
        uses: apache/incubator-kie-kogito-pipelines/.ci/actions/build-chain@main
        env:
          # -Dsurefire.reportFormat=xml ensures per-method <time> attributes are written.
          # -Dsurefire.failIfNoSpecifiedTests=false avoids failures when a module has no tests.
          BUILD_MVN_OPTS_CURRENT: '-Dfull -Dsurefire.reportFormat=xml -Dsurefire.failIfNoSpecifiedTests=false'
          MAVEN_OPTS: "-Dfile.encoding=UTF-8"
        with:
          definition-file: https://raw.githubusercontent.com/${GROUP:apache}/incubator-kie-kogito-pipelines/${BRANCH:main}/.ci/pull-request-config.yaml
          annotations-prefix: ${{ runner.os }}-${{ matrix.java-version }}/${{ matrix.maven-version }}
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Surefire Report (annotations)
        uses: apache/incubator-kie-kogito-pipelines/.ci/actions/surefire-report@main
        if: ${{ always() }}
        with:
          report_paths: '**/*-reports/TEST-*.xml'

      - name: Upload Surefire XML Reports
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: surefire-reports_${{ matrix.os }}_java${{ matrix.java-version }}
          # All surefire/failsafe XML reports contain per-method <testcase time="..."> attributes.
          path: '**/target/*-reports/TEST-*.xml'
          retention-days: 7
